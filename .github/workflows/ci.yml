name: Verify
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: personal-hardware
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'djsydney04/cloud-agents' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: [self-hosted, macOS, ARM64, cloud-agents]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electron-ui-report
          path: test-results/electron-ui/
          if-no-files-found: ignore
      - run: npm run test:desktop
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - run: python3 tests/setup.py
      - run: docker build -t cloud-agents-sandbox:0.1.0 sandbox
      - run: python3 tests/integration.py
      - run: node tests/local-setup.cjs
      - run: docker build -t cloud-agents-ssh-test tests/ssh
      - run: node tests/tunnel-integration.cjs
      - run: npm run package:desktop -- --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: codesign --verify --deep --strict "dist/mac-arm64/Cloud Agents.app"
