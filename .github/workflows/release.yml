name: Release binaries
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      linux:
        description: Build Linux assets on registered personal Linux runners
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: personal-hardware
  cancel-in-progress: false
jobs:
  host:
    if: github.repository == 'djsydney04/cloud-agents' && github.actor == github.repository_owner
    runs-on: [self-hosted, macOS, ARM64, cloud-agents]
    timeout-minutes: 30
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup target add "${{ matrix.target }}"
      - run: cargo test --locked && cargo build --release --locked --target "${{ matrix.target }}"
      - run: tar -czf cloud-agents-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release cloud-agents
      - uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.target }}
          path: cloud-agents-*.tar.gz
  desktop:
    if: github.repository == 'djsydney04/cloud-agents' && github.actor == github.repository_owner
    runs-on: [self-hosted, macOS, ARM64, cloud-agents]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run test:desktop
      - run: bash scripts/package-native.sh
      - run: npm run package:desktop -- --mac --arm64 --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            dist/*.dmg
            dist/*.zip
  linux-desktop:
    if: github.repository == 'djsydney04/cloud-agents' && github.actor == github.repository_owner && (inputs.linux || vars.CLOUD_AGENTS_LINUX_RELEASES == 'true')
    timeout-minutes: 30
    runs-on: [self-hosted, Linux, X64, cloud-agents]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run test:desktop
      - run: npm run package:desktop -- --linux
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: dist/*.AppImage
  linux-host:
    if: github.repository == 'djsydney04/cloud-agents' && github.actor == github.repository_owner && (inputs.linux || vars.CLOUD_AGENTS_LINUX_RELEASES == 'true')
    strategy:
      matrix:
        include:
          - architecture: X64
            target: x86_64-unknown-linux-gnu
          - architecture: ARM64
            target: aarch64-unknown-linux-gnu
    runs-on: [self-hosted, Linux, "${{ matrix.architecture }}", cloud-agents]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: cargo test --locked && cargo build --release --locked
      - run: tar -czf cloud-agents-${{ matrix.target }}.tar.gz -C target/release cloud-agents
      - uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.target }}
          path: cloud-agents-*.tar.gz
  publish:
    permissions:
      contents: write
    if: always() && github.repository == 'djsydney04/cloud-agents' && github.actor == github.repository_owner && startsWith(github.ref, 'refs/tags/v') && needs.host.result == 'success' && needs.desktop.result == 'success' && (needs.linux-desktop.result == 'success' || needs.linux-desktop.result == 'skipped') && (needs.linux-host.result == 'success' || needs.linux-host.result == 'skipped')
    needs: [host, desktop, linux-desktop, linux-host]
    runs-on: [self-hosted, macOS, ARM64, cloud-agents]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: cd release && shasum -a 256 * > SHA256SUMS
      - run: gh release create "$TAG" release/* --repo "$REPO" --title "Cloud Agents $TAG" --notes 'Self-hosted coding agent workspaces. See README for setup, networking, credentials, and verification limits. Desktop builds are unsigned/not notarized; build from source if your OS blocks them.'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
