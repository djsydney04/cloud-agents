name: Release binaries
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  host:
    strategy:
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked && cargo build --release --locked
      - run: tar -czf cloud-agents-${{ matrix.target }}.tar.gz -C target/release cloud-agents
      - uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.target }}
          path: cloud-agents-*.tar.gz
  desktop:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run test:desktop
      - run: bash scripts/package-native.sh
      - run: npm run package:desktop -- --mac --arm64 --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            dist/*.dmg
            dist/*.zip
  linux-desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run test:desktop
      - run: npm run package:desktop -- --linux
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: dist/*.AppImage
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host, desktop, linux-desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: cd release && sha256sum * > SHA256SUMS
      - run: gh release create "$TAG" release/* --repo "$REPO" --title "Cloud Agents $TAG" --notes 'Self-hosted coding agent workspaces. See README for setup, networking, credentials, and verification limits. Desktop builds are unsigned/not notarized; build from source if your OS blocks them.'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
