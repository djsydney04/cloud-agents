name: Release binaries
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: personal-hardware
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'djsydney04/cloud-agents' && github.actor == github.repository_owner
    runs-on: [self-hosted, macOS, ARM64, cloud-agents]
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: sh scripts/release.sh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-agents-downloads
          path: build/release/
      - if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$TAG" build/release/* --repo "$REPO" --title "Cloud Agents $TAG" --notes-file docs/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
